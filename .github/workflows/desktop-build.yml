name: بناء نسخة ويندوز

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: تثبيت الاعتماديات وبناء الويب
        run: |
          npm ci || npm install
          npm run build

      - name: اختبارات المحرك والواجهة
        shell: bash
        run: |
          npm test
          npm run e2e:render

      - name: بناء المثبّت
        run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: motion-studio-ai-pro-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
