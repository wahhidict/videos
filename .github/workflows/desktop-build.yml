name: بناء نسخة ويندوز

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/desktop-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: تثبيت الاعتماديات وبناء الويب
        run: |
          npm ci || npm install
          npm run build

      - name: تنزيل FFmpeg المرفق مع Playwright (غير مثبّت مسبقاً على عدّادات ويندوز)
        shell: bash
        run: npx playwright install chromium

      - name: اختبارات المحرك والواجهة
        shell: bash
        run: |
          npm test
          npm run e2e:render

      - name: التحقق من أن أصول الواجهة مبنية قبل تغليف Tauri
        shell: bash
        run: |
          test -f apps/web/dist/index.html || { echo "apps/web/dist/index.html is missing"; exit 1; }
          echo "dist OK: $(ls apps/web/dist/assets | wc -l) asset files"

      - name: بناء المثبّت
        run: npm run desktop:build

      - uses: actions/upload-artifact@v7
        with:
          name: motion-studio-ai-pro-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
