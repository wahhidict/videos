[package]
name = "motion-studio-ai-pro"
version = "3.0.0"
description = "استوديو الحركة الذكي"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[lib]
name = "msaipro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
